<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Island Walk</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1512;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
  canvas{display:block;cursor:grab}
  canvas:active{cursor:grabbing}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d1512;color:#dfe8dc;z-index:10;transition:opacity .9s}
  #loading h1{font-weight:300;letter-spacing:.25em;margin:0 0 14px;font-size:26px}
  #loading p{opacity:.65;margin:0;font-size:14px}
  #hud{position:fixed;left:16px;top:16px;color:#fff;background:rgba(8,14,12,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.7;z-index:5;transition:opacity .5s;pointer-events:none}
  #hud .k{display:inline-block;min-width:14px;padding:0 5px;border:1px solid rgba(255,255,255,.45);border-radius:4px;font-size:11px;text-align:center;margin-right:6px;line-height:16px}
  #hud .seed{opacity:.55;font-size:11px;margin-top:4px}
  #stats{position:fixed;left:16px;bottom:16px;color:#fff;background:rgba(8,14,12,.5);padding:6px 10px;border-radius:8px;font:12px ui-monospace,Menlo,monospace;z-index:5;display:none;pointer-events:none}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;background:#200;padding:40px;text-align:center;z-index:20}
</style>
</head>
<body>
<div id="loading"><h1>ISLAND</h1><p id="loadmsg">Starting…</p></div>
<div id="hud">
  <div><span class="k">↑</span><span class="k">↓</span>walk &nbsp; <span class="k">←</span><span class="k">→</span>turn</div>
  <div><span class="k">shift</span>run &nbsp; <span class="k">drag</span>look up / down</div>
  <div><span class="k">N</span>new island &nbsp; <span class="k">F</span>speed &nbsp; <span class="k">H</span>hide this</div>
  <div class="seed" id="seedlbl"></div>
</div>
<div id="err"></div>
<div id="stats"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';

const loadMsg = document.getElementById('loadmsg');

// ------------------------------------------------------------------ seed & noise

const rand = mulberry32(seed);
const nA = makeNoise(rand), nB = makeNoise(rand), nC = makeNoise(rand), nD = makeNoise(rand);
function fbm(n, x, z, oct) { let a = 1, f = 1, s = 0, t = 0; for (let i = 0; i < oct; i++) { s += a * n(x * f, z * f); t += a; a *= 0.5; f *= 2.03; } return s / t; }

// ------------------------------------------------------------------ island shape
const WORLD = 1600, HALF = WORLD / 2, RES = 640, CELL = WORLD / RES, VERTS = RES + 1;
const ISL = 520, WL = 0;

function landMask(x, z) {
  const r = Math.hypot(x, z);
  const m = 1 - r / ISL + fbm(nD, x * 0.0021, z * 0.0021, 4) * 0.5 + fbm(nC, x * 0.007 + 9, z * 0.007, 3) * 0.1;
  return Math.min(m, 1 - r / 700);

function cliffZone(x, z) { return smooth(-0.05, 0.2, fbm(nB, x * 0.0032 + 300, z * 0.0032 - 150, 3)); }
function rawHeight(x, z) {
  const m = landMask(x, z);
  let land = 4 + fbm(nA, x * 0.0028, z * 0.0028, 5) * 14
    + ridged(nB, x * 0.0045, z * 0.0045, 4) * 16 * smooth(0.1, 0.45, m)
    + smooth(0.25, 0.85, m) * 32;

  const terrZone = smooth(-0.1, 0.2, fbm(nC, x * 0.0035 + 70, z * 0.0035 - 20, 2));

  land += (terraced - land) * terrZone * smooth(0.08, 0.25, m);

  const cliff = cliffZone(x, z);
  land += cliff * smooth(0.0, 0.1, m) * 10;
  const k = smooth(0, 0.13, m) * (1 - cliff) + smooth(0, 0.018, m) * cliff;

function forestDensity(x, z, m) {
  return smooth(-0.1, 0.25, fbm(nC, x * 0.004 + 31, z * 0.004 - 12, 4)) * smooth(0.05, 0.2, m);
}

// grids
const H = new Float32Array(VERTS * VERTS);
const NRM = new Float32Array(VERTS * VERTS * 3);
const COL = new Float32Array(VERTS * VERTS * 3);
const GRASS = new Float32Array(VERTS * VERTS);

function getH(x, z) {
  const gx = (x + HALF) / CELL, gz = (z + HALF) / CELL;
  const i = clamp(Math.floor(gx), 0, RES - 1), j = clamp(Math.floor(gz), 0, RES - 1);
  const fx = gx - i, fz = gz - j;
  const h00 = H[j * VERTS + i], h10 = H[j * VERTS + i + 1], h01 = H[(j + 1) * VERTS + i], h11 = H[(j + 1) * VERTS + i + 1];

// ------------------------------------------------------------------ renderer / scene
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  const el = document.getElementById('err'); el.style.display = 'flex'; el.textContent = 'WebGL is not available in this browser.'; throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 6000);
camera.rotation.order = 'YXZ';
scene.add(camera);
const shared = { uTime: { value: 0 } };

// ------------------------------------------------------------------ procedural textures
function tileNoise(size, octaves, rnd) {

      const ix = Math.floor(fx), iy = Math.floor(fy);
      let tx = fx - ix, ty = fy - iy; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);

  for (let i = 0; i < data.length; i++) { const v = Math.round((data[i] - mn) / (mx - mn) * 255); img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255; }

  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; t.colorSpace = THREE.NoColorSpace;

const texRand = mulberry32(seed ^ 0x9e3779b9);

function waterNormalTex() {
  const s = 256, d = tileNoise(s, [[8, 1], [16, 0.6], [32, 0.35], [64, 0.2]], texRand);
  const cv = document.createElement('canvas'); cv.width = cv.height = s;

    const dy = (d[((y + 1) % s) * s + x] - d[((y - 1 + s) % s) * s + x]) * 9;

function barkTex(base) {

  const g = cv.getContext('2d'), r = mulberry32(seed + 77);

      const len = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / len, uy = (y1 - y0) / len;

// shared shader snippet: triplanar rock/soil detail + cliff strata
const TRIPLANAR = /* glsl */`

  float d1 = texture2D(uDetail, vWPos.zy * 0.33).r * tpW.x + texture2D(uDetail, vWPos.xz * 0.33).r * tpW.y + texture2D(uDetail, vWPos.xy * 0.33).r * tpW.z;
  float d2 = texture2D(uDetail, vWPos.zy * 0.041).r * tpW.x + texture2D(uDetail, vWPos.xz * 0.041).r * tpW.y + texture2D(uDetail, vWPos.xy * 0.041).r * tpW.z;

  float strata = 0.8 + 0.14 * sin(vWPos.y * 1.6 + d2 * 7.0) + 0.08 * sin(vWPos.y * 5.1 + d1 * 4.0);

// ------------------------------------------------------------------ caves
const CAVE = { hw: 2.7, cy: 1.7, ry: 2.5 };
const caves = [];

    const ny = slopeAt(cx, cz); if (ny > 0.45) continue;            // need a cliff face
    let ux = -bilinear(NRM, cx, cz, 3, 0), uz = -bilinear(NRM, cx, cz, 3, 2);
    const ul = Math.hypot(ux, uz); if (ul < 0.3) continue; ux /= ul; uz /= ul;

    const hb = getH(P[0], P[1]);

    if (getH(P[0] + ux * 9, P[1] + uz * 9) - hb < 7) continue;
    if (caves.some(c => Math.hypot(c.P[0] - P[0], c.P[1] - P[1]) < 120)) continue;

// ------------------------------------------------------------------ grass (streams in around the walker)
const GCH = 16, GRAD = 3, TUFTS = 1700;

    sh.uniforms.uTime = shared.uTime; sh.uniforms.uCam = grassU.uCam; sh.uniforms.uFade = grassU.uFade;
    sh.vertexShader = 'uniform float uTime;\nuniform vec3 uCam;\nuniform vec2 uFade;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
      float fade = 1.0 - smoothstep(uFade.x, uFade.y, distance(ip.xz, uCam.xz));

      transformed.y *= fade;
      float wv = sin(uTime * 1.7 + ip.x * 0.21 + ip.z * 0.17) + 0.5 * sin(uTime * 3.2 + ip.x * 0.53 - ip.z * 0.37);

const FLOWER_COLS = [0xffffff, 0xf3d23a, 0xb38be0, 0x8fb6f0, 0xf09ab8].map(h => new THREE.Color(h));
function buildGrassChunk(item, cx, cz) {

function updateGrass(px, pz, budget) {

  for (const [k, item] of grassActive) if (!keys.has(k)) { item.grass.visible = item.flowers.visible = false; grassPool.push(item); grassActive.delete(k); }
  want.sort((a, b) => a[2] - b[2]);

    const k = x + ',' + z; if (grassActive.has(k)) continue;
    if (budget-- <= 0) break;
    let item = grassPool.pop();
    if (!item) {
      item = { grass: new THREE.InstancedMesh(grassGeo, grassMat, TUFTS), flowers: new THREE.InstancedMesh(flowerGeo, flowerMat, 60) };
      item.grass.receiveShadow = true; item.flowers.receiveShadow = true;
      item.grass.setColorAt(0, new THREE.Color()); item.flowers.setColorAt(0, new THREE.Color());
      scene.add(item.grass, item.flowers);
    }
    buildGrassChunk(item, x, z);
    grassActive.set(k, item);
  }
}

    .map(v => (v * (v + 0.0245786) - 0.000090537) / (v * (0.983729 * v + 0.4329510) + 0.238081));
  const o = [1.60475 * i[0] - 0.53108 * i[1] - 0.07367 * i[2], -0.10208 * i[0] + 1.10813 * i[1] - 0.00605 * i[2], -0.00327 * i[0] - 0.07276 * i[1] + 1.07602 * i[2]]

}

// ------------------------------------------------------------------ walker
const player = { x: 0, z: 0, ground: 0, layer: 'terrain', yaw: 0, pitch: -0.04, speed: 0, turn: 0, eyeY: 0, bob: 0, dark: 0 };
function groundAt(x, z, cur) {
  const h = getH(x, z), c = caveAt(x, z);
  if (c && (Math.abs(cur - c.floor) < Math.abs(cur - h) || (c.along > 0.5 && Math.abs(cur - c.floor) < 1.6))) return { y: c.floor, layer: 'cave', c };
  return { y: h, layer: 'terrain', c: null };
}
function tryMove(x, z) {
  const g = groundAt(x, z, player.ground);
  if (g.layer === 'terrain') {
    if (g.y < WL - 0.45) return false;
    if (slopeAt(x, z) < 0.55 && g.y > player.ground) return false;
    if (Math.hypot(x, z) > 760) return false;
    if (collides(x, z, 0.35)) return false;
  }
  if (g.y - player.ground > 0.7 || player.ground - g.y > 1.6) return false;
  player.x = x; player.z = z; player.ground = g.y; player.layer = g.layer;
  return true;
}
function findSpawn() {
  const r = mulberry32(seed ^ 0x1234);
  for (let t = 0; t < 200; t++) {
    const a = r() * Math.PI * 2, dx = Math.cos(a), dz = Math.sin(a);
    for (let d = 760; d > 50; d -= 2) {
      const x = dx * d, z = dz * d, h = getH(x, z);
      if (h > 1.4) {
        if (h < 3.5 && slopeAt(x, z) > 0.93 && !collides(x, z, 1)) {
          player.x = x; player.z = z; player.ground = h;
          player.yaw = Math.atan2(dx, dz) + (r() - 0.5) * 0.6;
          return;
        }
        break;
      }
    }
  }
  player.x = 0; player.z = 0; player.ground = getH(0, 0);
}

const keys = {};
addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyF') { const st = document.getElementById('stats'); st.style.display = st.style.display === 'block' ? 'none' : 'block'; }
  if (e.code === 'KeyH') { const h = document.getElementById('hud'); h.style.opacity = h.style.opacity === '0' ? '1' : '0'; }
  if (e.code === 'KeyN') { location.hash = 'seed=' + Math.floor(Math.random() * 1e9); location.reload(); }
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
let dragging = false;
renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointerup', () => { dragging = false; });
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  player.yaw -= e.movementX * 0.003; player.pitch = clamp(player.pitch - e.movementY * 0.003, -1.2, 1.2);
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const WALK_RUN = [4.6, 9.0]; // metres per second
function updatePlayer(dt) {
  const fwd = (keys.ArrowUp || keys.KeyW ? 1 : 0) - (keys.ArrowDown || keys.KeyS ? 1 : 0);
  const trn = (keys.ArrowLeft || keys.KeyA ? 1 : 0) - (keys.ArrowRight || keys.KeyD ? 1 : 0);
  const run = keys.ShiftLeft || keys.ShiftRight;
  player.turn += (trn * 1.7 - player.turn) * Math.min(1, dt * 7);
  player.yaw += player.turn * dt;
  const target = fwd * (run ? WALK_RUN[1] : WALK_RUN[0]) * (fwd < 0 ? 0.6 : 1);
  player.speed += (target - player.speed) * Math.min(1, dt * 4);
  const step = player.speed * dt, dx = -Math.sin(player.yaw) * step, dz = -Math.cos(player.yaw) * step;
  if (Math.abs(step) > 1e-5) {
    // sub-step so fast movement can't tunnel through walls
    const n = Math.ceil(Math.abs(step) / 0.15);
    for (let i = 0; i < n; i++) {
      if (!tryMove(player.x + dx / n, player.z + dz / n)) {
        if (!tryMove(player.x + dx / n, player.z)) tryMove(player.x, player.z + dz / n);
      }
    }
  }
  const moving = Math.min(1, Math.abs(player.speed) / WALK_RUN[0]);
  player.bob += dt * Math.PI * (1.6 + Math.abs(player.speed) * 0.14) * moving;
  const eye = player.ground + 1.68 + Math.sin(player.bob) * 0.035 * moving;
  player.eyeY = player.eyeY === 0 ? eye : player.eyeY + (eye - player.eyeY) * Math.min(1, dt * 12);
  camera.position.set(player.x, player.eyeY, player.z);
  camera.rotation.set(player.pitch + Math.sin(player.bob * 0.5) * 0.004 * moving, player.yaw, 0);
  // darkness inside caves: eyes adjust and a lantern glows
  const c = player.layer === 'cave' ? caveAt(player.x, player.z) : null;
  const darkT = c ? smooth(3, 18, c.along) : 0;
  player.dark += (darkT - player.dark) * Math.min(1, dt * 1.5);
}

// ------------------------------------------------------------------ main
await generate();
makeGrassAssets();
findSpawn();
updatePlayer(0);
updateGrass(player.x, player.z, 999);
await status('Almost there…');
renderer.compile(scene, camera);
const loading = document.getElementById('loading');
loading.style.opacity = '0'; setTimeout(() => loading.remove(), 1000);

const clock = new THREE.Clock();
const statsEl = document.getElementById('stats'); let statFrames = 0, statTime = 0;
const fwdV = new V3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.25);
  shared.uTime.value += dt;
  updatePlayer(dt);
  grassU.uCam.value.copy(camera.position);
  updateGrass(player.x, player.z, 2);
  // keep the sun's shadow box centred just ahead of the walker
  fwdV.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const texel = 140 / 2048;
  const cx = Math.round((player.x + fwdV.x * 18) / texel) * texel, cz = Math.round((player.z + fwdV.z * 18) / texel) * texel, cy = player.ground;
  sunLight.position.set(cx + sunDir.x * 300, cy + sunDir.y * 300, cz + sunDir.z * 300);
  sunLight.target.position.set(cx, cy, cz); sunLight.target.updateMatrixWorld();
  sky.position.copy(camera.position); clouds.position.copy(camera.position);
  waterNormals.offset.set(shared.uTime.value * 0.006, shared.uTime.value * 0.004);
  renderer.toneMappingExposure = baseExposure * (1 + player.dark * 2.2);
  lantern.intensity = player.dark * 9 * lantern.userData.L;
  renderer.render(scene, camera);
  statFrames++; statTime += dt;
  if (statTime >= 0.5) {
    statsEl.textContent = `${Math.round(statFrames / statTime)} fps · ${Math.abs(player.speed).toFixed(1)} m/s`;
    statFrames = 0; statTime = 0;
  }
});
</script>
</body>
